<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <!-- Wooden Outer Box -->
  <rect x="0" y="0" width="64" height="64" fill="#3a2010"/>
  <rect x="4" y="4" width="56" height="56" fill="#704214"/>
  <rect x="8" y="8" width="48" height="48" fill="#fcf6e2"/>
  <rect x="10" y="10" width="44" height="44" fill="#4a7c32"/>

  <!-- Pixel Gold Trophy Base -->
  <rect x="24" y="46" width="16" height="4" fill="#78350f"/>
  <rect x="26" y="42" width="12" height="4" fill="#d97706"/>
  <rect x="28" y="38" width="8" height="4" fill="#f59e0b"/>

  <!-- Trophy Cup Body -->
  <rect x="22" y="24" width="20" height="14" fill="#fcd34d"/>
  <rect x="24" y="26" width="16" height="10" fill="#fbbf24"/>
  <rect x="26" y="28" width="12" height="6" fill="#f59e0b"/>

  <!-- Trophy Handles -->
  <rect x="18" y="26" width="4" height="8" fill="#d97706"/>
  <rect x="18" y="28" width="2" height="4" fill="#4a7c32"/>
  <rect x="42" y="26" width="4" height="8" fill="#d97706"/>
  <rect x="44" y="28" width="2" height="4" fill="#4a7c32"/>

  <!-- Pixel Boxing Glove Crossing In Front -->
  <rect x="14" y="14" width="16" height="16" rx="2" fill="#dc2626"/>
  <rect x="12" y="18" width="6" height="8" fill="#b91c1c"/>
  <rect x="18" y="16" width="10" height="10" fill="#ef4444"/>
  <rect x="22" y="26" width="8" height="4" fill="#ffffff"/> <!-- Glove tape -->

  <!-- Star / Impact Sparkle -->
  <rect x="34" y="12" width="4" height="4" fill="#ffffff"/>
  <rect x="36" y="10" width="2" height="8" fill="#fde047"/>
  <rect x="32" y="14" width="8" height="2" fill="#fde047"/>

  <!-- Blue Glove Clashing from Right -->
  <rect x="36" y="20" width="14" height="14" rx="2" fill="#2563eb"/>
  <rect x="46" y="22" width="4" height="8" fill="#1d4ed8"/>
  <rect x="38" y="22" width="10" height="8" fill="#3b82f6"/>
</svg>
